<!DOCTYPE html>
<head>
  <title>Atlas Yurdakurban's Projects</title>
  <link rel="icon" type="image/png" href="cookie.png">
  <link rel="stylesheet" href="projects/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="list-container" style="margin-top: 30px;">
    <h1>My games and stuff</h1>
  </div>
  <a href="https://atlas-yurdakurban.com/topdown-claude" style="margin-left: 50px; margin-top: 30px;" target="_blank" class="btn tbackground">
    <img src="projects/gridrunner.png" class="align-middle" width="416" height="156" style="border-radius: 10px;">
  </a>
  <a href="https://atlas-yurdakurban.com/frosthold" target="_blank" style="margin-top: 30px;" class="btn tbackground">
    <img src="projects/frosthold.png" class="align-middle" width="416" height="156" style="border-radius: 10px;">
  </a>
  <a href="https://atlas-yurdakurban.com/snake" target="_blank" style="margin-top: 30px;" class="btn tbackground">
    <img src="projects/snake.png" class="align-middle" width="416" height="156" style="border-radius: 10px;">
  </a>
  <footer class="site-footer">
    <div class="footer-container">
        <div class="footer-column special-size another-special-size">
            <a href="https://atlas-yurdakurban.com" alt="Main Page" title="Main Page">
                <img src="logo.png">
            </a>
        </div>
        
        <div class="footer-column">
            <h3>Quick Links</h3>
            <ul>
                <li><a href="https://atlas-yurdakurban.com">Home</a></li>
                <li><a href="https://atlas-yurdakurban.com/aboutme">About</a></li>
                <li><a href="https://atlas-yurdakurban.com/projects">Games & Stuff</a></li>
            </ul>
        </div>

        <div class="footer-column">
            <h3>Connect</h3>
            <ul>
                <li><a href="https://github.com/falanfila/cookie_clicker" target="_blank" rel="noopener noreferrer">GitHub</a></li>
                <li><a href="https://atlas-yurdakurban.com/feedback">Feedback & Contact Me</a></li>
            </ul>
        </div>
        <form id="subscribe-form">
            <div class="input-group mb-3">
              <input type="email" class="form-control" id="sub-email" placeholder="Your mail adress" required />
              <button type="submit" class="btn btn-primary">Subscribe</button>
            </div>
        </form>
        <p id="sub-msg" style="display:none"></p><br>
        <p>Subscribe for getting the latest updates instantly.</p>
        
        <script>
        document.getElementById('subscribe-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('sub-email').value;
          const msg = document.getElementById('sub-msg');
        
          const res = await fetch('/api/subscribe', {
            method: 'POST',
            body: JSON.stringify({ email }),
          });
        
          msg.style.display = 'block';
          msg.textContent = res.ok ? '  Success!' : '  An error occured, please try again.';
          setTimeout(function() {
              msg.style.display = 'none'; // Yazıyı tekrar gizle
          }, 3000); // 3000 milisaniye = 3 saniye
        });
        
        </script>

    </div>
    
    <div class="footer-bottom">
        <p></p>
    </div>
</footer>
</body>
