<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117; /* Sleek dark background */
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Main content container stays on top */
        .container {
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 10;
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 16px;
        }

        .error-code {
            font-size: 9rem;
            font-weight: 800;
            margin: 0;
            line-height: 1;
            background: linear-gradient(45deg, #ff7b72, #79c0ff, #56d4dd);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float 4s ease-in-out infinite, gradientShift 8s ease infinite;
        }

        .message {
            font-size: 1.75rem;
            font-weight: 600;
            margin: 20px 0 10px 0;
            color: #f0f6fc;
        }

        .subtext {
            font-size: 1.1rem;
            color: #8b949e;
            margin-bottom: 40px;
        }

        .home-btn {
            display: inline-block;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(45deg, #238636, #2ea043);
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(46, 160, 67, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(46, 160, 67, 0.5);
        }

        /* --- Background Rocket Animation Elements --- */
        .rocket-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .rocket {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0;
            filter: drop-shadow(0 0 10px rgba(121, 192, 255, 0.4));
        }

        /* Rocket 1: Fast, small, steep angle */
        .r1 {
            font-size: 1.8rem;
            animation: flyAcross 7s linear infinite;
            animation-delay: 0s;
        }

        /* Rocket 2: Slower, larger, lower path */
        .r2 {
            font-size: 3rem;
            animation: flyAcrossAlternative 12s linear infinite;
            animation-delay: 3s;
        }

        /* Rocket 3: Medium size, delayed start */
        .r3 {
            font-size: 2.2rem;
            animation: flyAcross 9s linear infinite;
            animation-delay: 4.5s;
        }

        /* --- Animations --- */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Standard flight path: Bottom-Left to Top-Right */
        @keyframes flyAcross {
            0% {
                transform: translate(-10vw, 105vh) rotate(45deg);
                opacity: 0;
            }
            5% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translate(105vw, -10vh) rotate(45deg);
                opacity: 0;
            }
        }

        /* Alternative flight path: Lower trajectory and slightly different angle */
        @keyframes flyAcrossAlternative {
            0% {
                transform: translate(-10vw, 70vh) rotate(35deg);
                opacity: 0;
            }
            5% {
                opacity: 0.5;
            }
            95% {
                opacity: 0.5;
            }
            100% {
                transform: translate(105vw, 15vh) rotate(35deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div class="rocket-layer">
    <div class="rocket r1">🚀</div>
    <div class="rocket r2">🚀</div>
    <div class="rocket r3">🚀</div>
</div>

<div class="container">
    <h1 class="error-code">404</h1>
    <p class="message">Whoops! You've drifted into uncharted space.</p>
    <p class="subtext">The page you are looking for doesn't exist, but hey—at least the animations work flawlessly!</p>
    <a href="/" class="home-btn">Take Me Home</a>
</div>

</body>
</html>
