<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top-down Shooter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;}
canvas{display:block;background:#111;}
#ui{position:absolute;top:0;left:0;width:100%;pointer-events:none;}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);color:#fff;font-family:'Courier New',monospace;}
#overlay h1{font-size:2.2rem;color:#f0c040;letter-spacing:4px;text-shadow:0 0 20px #f0c04066;margin-bottom:8px;}
#overlay p{color:#aaa;font-size:.85rem;margin-bottom:6px;}
#overlay .big{font-size:1.1rem;color:#eee;margin-bottom:20px;}
#startBtn{background:#f0c040;color:#111;border:none;padding:12px 32px;font-size:1rem;font-family:'Courier New',monospace;font-weight:bold;cursor:pointer;border-radius:4px;letter-spacing:2px;pointer-events:all;}
#startBtn:hover{background:#ffd060;}
#hud{padding:10px 14px;display:flex;gap:16px;align-items:center;font-family:'Courier New',monospace;font-size:.8rem;color:#eee;}
.hud-item{display:flex;align-items:center;gap:5px;}
#healthBar{width:100px;height:10px;background:#333;border-radius:3px;overflow:hidden;}
#healthFill{height:100%;background:#e84040;transition:width .2s;}
#xpBar{width:80px;height:8px;background:#333;border-radius:3px;overflow:hidden;}
#xpFill{height:100%;background:#40a0f0;transition:width .3s;}
#shopOverlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Courier New',monospace;color:#fff;}
#shopOverlay h2{color:#f0c040;font-size:1.5rem;margin-bottom:6px;letter-spacing:3px;}
#shopOverlay p{color:#888;font-size:.8rem;margin-bottom:20px;}
.shop-cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:560px;}
.shop-card{background:#1a1a2e;border:1px solid #444;border-radius:8px;padding:16px;width:140px;cursor:pointer;text-align:center;transition:border-color .2s,transform .1s;pointer-events:all;}
.shop-card:hover{border-color:#f0c040;transform:scale(1.04);}
.shop-card .icon{font-size:2rem;margin-bottom:8px;}
.shop-card .name{font-size:.85rem;color:#f0c040;font-weight:bold;margin-bottom:4px;}
.shop-card .desc{font-size:.7rem;color:#999;line-height:1.4;}
#waveAnn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Courier New',monospace;font-size:1.8rem;color:#f0c040;font-weight:bold;pointer-events:none;opacity:0;transition:opacity .4s;text-shadow:0 0 20px #f0c04088;}
</style>
</head>
<body>
<div style="position:relative;width:800px;height:560px;overflow:hidden;">
<canvas id="gc"></canvas>
<div id="ui">
  <div id="hud" style="display:none;">
    <div class="hud-item">❤️<div id="healthBar"><div id="healthFill" style="width:100%"></div></div><span id="hpTxt">100</span></div>
    <div class="hud-item">⭐<div id="xpBar"><div id="xpFill" style="width:0%"></div></div><span id="lvlTxt">Lv1</span></div>
    <div class="hud-item">💀<span id="killTxt">0</span></div>
    <div class="hud-item">🌊<span id="waveTxt">1</span></div>
    <div class="hud-item">⏱<span id="timerTxt">30</span></div>
  </div>
</div>
<div id="overlay">
  <h1>BROTATO</h1>
  <p style="color:#f0c040;font-size:.7rem;letter-spacing:2px;">TOP-DOWN SURVIVAL</p>
  <div class="big" style="margin-top:16px;">WASD / Arrow Keys → Move</div>
  <div class="big">Auto-fire • Survive the waves</div>
  <div class="big">Pick an upgrade after each wave!</div>
  <button id="startBtn" onclick="startGame()">PLAY ▶</button>
</div>
<div id="shopOverlay" style="display:none;"></div>
<div id="waveAnn"></div>
</div>
<script>
const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');
const container=canvas.parentElement;
let W,H;
function resize(){W=container.clientWidth;H=container.clientHeight;canvas.width=W;canvas.height=H;}
resize();

let game=null;
const UPGRADES=[
  {id:'dmg',icon:'⚔️',name:'Damage +',desc:'Bullet damage increases'},
  {id:'spd',icon:'👟',name:'Speed +',desc:'Movement speed increases'},
  {id:'fire',icon:'🔥',name:'Fire Rate +',desc:'Shoot faster'},
  {id:'hp',icon:'❤️',name:'Max HP +',desc:'Max health increases and heals'},
  {id:'range',icon:'🎯',name:'Range +',desc:'Bullets travel farther'},
  {id:'multi',icon:'💥',name:'Multi-Shot',desc:'Fire in extra directions'},
];

function pickUpgrades(){
  const shuffled=[...UPGRADES].sort(()=>Math.random()-.5);
  return shuffled.slice(0,3);
}

function showShop(wave){
  const shop=document.getElementById('shopOverlay');
  const opts=pickUpgrades();
  shop.innerHTML=`<h2>WAVE ${wave} COMPLETE!</h2><p>Choose 1 of 3 upgrades</p><div class="shop-cards">${opts.map(u=>`<div class="shop-card" onclick="applyUpgrade('${u.id}')"><div class="icon">${u.icon}</div><div class="name">${u.name}</div><div class="desc">${u.desc}</div></div>`).join('')}</div>`;
  shop.style.display='flex';
}

function applyUpgrade(id){
  const g=game;
  if(!g)return;
  if(id==='dmg')g.player.damage+=5;
  if(id==='spd')g.player.speed+=0.8;
  if(id==='fire')g.player.fireRate=Math.max(5,g.player.fireRate-4);
  if(id==='hp'){g.player.maxHp+=30;g.player.hp=Math.min(g.player.maxHp,g.player.hp+30);}
  if(id==='range')g.player.bulletRange+=60;
  if(id==='multi')g.player.multiShot=Math.min(5,(g.player.multiShot||1)+1);
  document.getElementById('shopOverlay').style.display='none';
  g.startWave(g.wave+1);
}

class Particle{
  constructor(x,y,col){this.x=x;this.y=y;this.col=col||'#f84';this.vx=(Math.random()-.5)*4;this.vy=(Math.random()-.5)*4;this.life=20+Math.random()*15;this.maxLife=this.life;}
  update(){this.x+=this.vx;this.y+=this.vy;this.vx*=.92;this.vy*=.92;this.life--;}
  draw(){ctx.globalAlpha=this.life/this.maxLife;ctx.fillStyle=this.col;ctx.beginPath();ctx.arc(this.x,this.y,2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
}

class Game{
  constructor(){
    this.player={x:W/2,y:H/2,hp:100,maxHp:100,speed:3,damage:12,fireRate:18,bulletRange:200,multiShot:1,fireCd:0,xp:0,xpNext:30,level:1,kills:0};
    this.bullets=[];this.enemies=[];this.particles=[];
    this.wave=1;this.waveTimer=0;this.waveDuration=1800;
    this.keys={};this.running=false;this.gameOver=false;
    this.raf=null;
    this.spawnTimer=0;this.spawnRate=80;
    document.addEventListener('keydown',e=>{this.keys[e.key]=true;['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)&&e.preventDefault();});
    document.addEventListener('keyup',e=>{this.keys[e.key]=false;});
    this.startWave(1);
  }
  startWave(w){
    this.wave=w;this.waveTimer=0;this.running=true;
    this.enemies=[];this.bullets=[];this.particles=[];
    this.spawnRate=Math.max(20,80-w*7);
    document.getElementById('waveTxt').textContent=w;
    const ann=document.getElementById('waveAnn');
    ann.textContent='WAVE '+w;ann.style.opacity='1';
    setTimeout(()=>{ann.style.opacity='0';},1600);
    if(this.raf)cancelAnimationFrame(this.raf);
    this.loop();
  }
  spawnEnemy(){
    const side=Math.floor(Math.random()*4);
    let x,y;const m=30;
    if(side===0){x=Math.random()*W;y=-m;}
    else if(side===1){x=W+m;y=Math.random()*H;}
    else if(side===2){x=Math.random()*W;y=H+m;}
    else{x=-m;y=Math.random()*H;}
    const type=this.wave>=4&&Math.random()<.12?'tank':this.wave>=2&&Math.random()<.2?'fast':'basic';
    const hp=type==='tank'?(40+this.wave*15):(type==='fast'?15+this.wave*3:20+this.wave*5);
    this.enemies.push({x,y,hp,maxHp:hp,type,spd:type==='fast'?2.8+this.wave*.15:type==='tank'?.9+this.wave*.05:1.6+this.wave*.1,size:type==='tank'?18:type==='fast'?9:13,col:type==='tank'?'#e84040':type==='fast'?'#40e8a0':'#e87020'});
  }
  autoShoot(){
    const p=this.player;
    if(p.fireCd>0){p.fireCd--;return;}
    if(this.enemies.length===0)return;
    let nearest=null,minD=1e9;
    for(const e of this.enemies){const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<minD){minD=d;nearest=e;}}
    if(!nearest)return;
    p.fireCd=p.fireRate;
    const shots=p.multiShot||1;
    for(let i=0;i<shots;i++){
      const angle=Math.atan2(nearest.y-p.y,nearest.x-p.x)+(i-(shots-1)/2)*0.25;
      this.bullets.push({x:p.x,y:p.y,vx:Math.cos(angle)*9,vy:Math.sin(angle)*9,dmg:p.damage,dist:0,maxDist:p.bulletRange});
    }
  }
  update(){
    const p=this.player;
    const spd=p.speed;
    if(this.keys['ArrowLeft']||this.keys['a'])p.x-=spd;
    if(this.keys['ArrowRight']||this.keys['d'])p.x+=spd;
    if(this.keys['ArrowUp']||this.keys['w'])p.y-=spd;
    if(this.keys['ArrowDown']||this.keys['s'])p.y+=spd;
    p.x=Math.max(16,Math.min(W-16,p.x));
    p.y=Math.max(16,Math.min(H-16,p.y));
    this.autoShoot();
    this.waveTimer++;
    this.spawnTimer++;
    if(this.spawnTimer>=this.spawnRate){this.spawnTimer=0;this.spawnEnemy();}
    for(const b of this.bullets){b.x+=b.vx;b.y+=b.vy;b.dist+=Math.hypot(b.vx,b.vy);}
    this.bullets=this.bullets.filter(b=>b.dist<b.maxDist&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
    for(const e of this.enemies){
      const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy);
      if(d>0){e.x+=e.spd*dx/d;e.y+=e.spd*dy/d;}
      if(d<16+e.size){p.hp-=.35;}
    }
    for(let i=this.bullets.length-1;i>=0;i--){
      const b=this.bullets[i];
      for(let j=this.enemies.length-1;j>=0;j--){
        const e=this.enemies[j];
        if(Math.hypot(b.x-e.x,b.y-e.y)<e.size+4){
          e.hp-=b.dmg;
          for(let k=0;k<5;k++)this.particles.push(new Particle(e.x,e.y,e.col));
          this.bullets.splice(i,1);
          if(e.hp<=0){
            p.xp+=e.type==='tank'?8:e.type==='fast'?3:5;
            p.kills++;
            for(let k=0;k<10;k++)this.particles.push(new Particle(e.x,e.y,e.col));
            this.enemies.splice(j,1);
          }
          break;
        }
      }
    }
    while(p.xp>=p.xpNext){p.xp-=p.xpNext;p.level++;p.xpNext=Math.floor(p.xpNext*1.5);}
    for(let i=this.particles.length-1;i>=0;i--){this.particles[i].update();if(this.particles[i].life<=0)this.particles.splice(i,1);}
    if(p.hp<=0){p.hp=0;this.gameOver=true;this.running=false;}
    if(this.waveTimer>=this.waveDuration){this.running=false;showShop(this.wave);}
    this.updateHUD();
  }
  updateHUD(){
    const p=this.player;
    document.getElementById('healthFill').style.width=Math.max(0,(p.hp/p.maxHp)*100)+'%';
    document.getElementById('hpTxt').textContent=Math.ceil(p.hp);
    document.getElementById('xpFill').style.width=(p.xp/p.xpNext*100)+'%';
    document.getElementById('lvlTxt').textContent='Lv'+p.level;
    document.getElementById('killTxt').textContent=p.kills;
    document.getElementById('timerTxt').textContent=Math.ceil((this.waveDuration-this.waveTimer)/60);
  }
  drawArena(){
    ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#1e1e2e';ctx.lineWidth=1;
    const gs=60;
    for(let x=0;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  }
  draw(){
    this.drawArena();
    for(const p2 of this.particles)p2.draw();
    for(const e of this.enemies){
      ctx.fillStyle=e.col;ctx.beginPath();ctx.arc(e.x,e.y,e.size,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#2a2a2a';ctx.fillRect(e.x-e.size,e.y-e.size-8,e.size*2,4);
      ctx.fillStyle='#e84040';ctx.fillRect(e.x-e.size,e.y-e.size-8,e.size*2*(e.hp/e.maxHp),4);
      if(e.type==='tank'){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(e.x,e.y,e.size,0,Math.PI*2);ctx.stroke();}
    }
    for(const b of this.bullets){
      ctx.fillStyle='#ffe060';ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();
    }
    const p=this.player;
    ctx.save();ctx.translate(p.x,p.y);
    ctx.fillStyle='#60aaff';ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();
    const nearest=this.enemies.reduce((n,e)=>{const d=Math.hypot(e.x-p.x,e.y-p.y);return(!n||d<Math.hypot(n.x-p.x,n.y-p.y))?e:n;},null);
    if(nearest){
      const a=Math.atan2(nearest.y-p.y,nearest.x-p.x);
      ctx.fillStyle='#60aaff';ctx.beginPath();
      ctx.moveTo(Math.cos(a)*10,Math.sin(a)*10);
      ctx.lineTo(Math.cos(a+.5)*6,Math.sin(a+.5)*6);
      ctx.lineTo(Math.cos(a-.5)*6,Math.sin(a-.5)*6);
      ctx.closePath();ctx.fill();
    }
    ctx.restore();
    if(this.gameOver){
      ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#e84040';ctx.font='bold 2.5rem Courier New';ctx.textAlign='center';
      ctx.fillText('GAME OVER',W/2,H/2-30);
      ctx.fillStyle='#aaa';ctx.font='1rem Courier New';
      ctx.fillText('Wave '+this.wave+' • '+p.kills+' kills • Lv'+p.level,W/2,H/2+10);
      ctx.fillStyle='#f0c040';ctx.font='bold .9rem Courier New';
      ctx.fillText('Refresh the page to play again',W/2,H/2+50);
    }
  }
  loop(){
    if(!this.running&&!this.gameOver)return;
    this.update();this.draw();
    this.raf=requestAnimationFrame(()=>this.loop());
  }
}

function startGame(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('hud').style.display='flex';
  game=new Game();
}
</script>
</body>
</html>
