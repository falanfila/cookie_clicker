<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-down Shooter</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            border: 4px solid #444;
            background-color: #333;
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            text-shadow: 2px 2px black;
            pointer-events: none;
        }
        #upgradeMenu {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #888;
            text-align: center;
        }
        .upgradeBtn {
            display: block;
            width: 200px;
            padding: 10px;
            margin: 10px auto;
            background: #555;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .upgradeBtn:hover {
            background: #777;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui">
        Wave: <span id="waveTxt">1</span> |
        Time Left: <span id="timeTxt">20</span>s |
        Materials: <span id="goldTxt">0</span>
    </div>
    <div id="upgradeMenu">
        <h2>Wave Cleared! Choose an Upgrade:</h2>
        <button class="upgradeBtn" onclick="chooseUpgrade('damage')">+2 Damage</button>
        <button class="upgradeBtn" onclick="chooseUpgrade('speed')">+0.5 Movement Speed</button>
        <button class="upgradeBtn" onclick="chooseUpgrade('hp')">+20 Max HP</button>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Game State
    let gameState = "PLAYING"; // PLAYING, UPGRADE, GAMEOVER
    let wave = 1;
    let waveTimer = 20; // 20 seconds per wave
    let timerInterval;
    let spawnInterval;

    // Keyboard Controls
    const keys = {};
    window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
    window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

    // Player Stats
    const player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 15,
        speed: 3.5,
        hp: 100,
        maxHp: 100,
        damage: 5,
        attackSpeed: 400, // fire rate in milliseconds
        lastShot: 0,
        materials: 0
    };

    let enemies = [];
    let bullets = [];

    // Enemy Class
    class Enemy {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 12;
            this.speed = 1.5 + (wave * 0.1);
            this.hp = 10 + (wave * 3);
            this.maxHp = this.hp;
        }
        update() {
            // Move towards the player
            let dx = player.x - this.x;
            let dy = player.y - this.y;
            let dist = Math.hypot(dx, dy);
            if (dist > 0) {
                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
            }
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#ff4444";
            ctx.fill();
            ctx.closePath();

            // Enemy Health Bar
            ctx.fillStyle = "red";
            ctx.fillRect(this.x - 15, this.y - 20, 30, 4);
            ctx.fillStyle = "green";
            ctx.fillRect(this.x - 15, this.y - 20, (this.hp / this.maxHp) * 30, 4);
        }
    }

    // Bullet Class
    class Bullet {
        constructor(x, y, targetX, targetY) {
            this.x = x;
            this.y = y;
            this.radius = 5;
            this.speed = 7;
            let dx = targetX - x;
            let dy = targetY - y;
            let dist = Math.hypot(dx, dy);
            this.vx = (dx / dist) * this.speed;
            this.vy = (dy / dist) * this.speed;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#ffff55";
            ctx.fill();
            ctx.closePath();
        }
    }

    // Spawn enemies randomly at the edges
    function spawnEnemy() {
        if (gameState !== "PLAYING") return;
        let x, y;
        if (Math.random() < 0.5) {
            x = Math.random() < 0.5 ? -20 : canvas.width + 20;
            y = Math.random() * canvas.height;
        } else {
            x = Math.random() * canvas.width;
            y = Math.random() < 0.5 ? -20 : canvas.height + 20;
        }
        enemies.push(new Enemy(x, y));
    }

    // Start Timers
    function startIntervals() {
        timerInterval = setInterval(() => {
            if (gameState === "PLAYING") {
                waveTimer--;
                document.getElementById("timeTxt").innerText = waveTimer;
                if (waveTimer <= 0) {
                    endWave();
                }
            }
        }, 1000);

        spawnInterval = setInterval(spawnEnemy, 1000 - (wave * 50 > 600 ? 600 : wave * 50));
    }

    function endWave() {
        gameState = "UPGRADE";
        clearInterval(timerInterval);
        clearInterval(spawnInterval);
        enemies = [];
        bullets = [];
        document.getElementById("upgradeMenu").style.display = "block";
    }

    function chooseUpgrade(type) {
        if (type === 'damage') player.damage += 2;
        if (type === 'speed') player.speed += 0.5;
        if (type === 'hp') {
            player.maxHp += 20;
            player.hp += 20;
        }

        // Next Wave Setup
        wave++;
        waveTimer = 20;
        document.getElementById("waveTxt").innerText = wave;
        document.getElementById("timeTxt").innerText = waveTimer;
        document.getElementById("upgradeMenu").style.display = "none";
        gameState = "PLAYING";
        startIntervals();
    }

    // Auto-Attack Mechanism (Targeting the Closest Enemy)
    function autoAttack(currentTime) {
        if (enemies.length === 0) return;
        if (currentTime - player.lastShot < player.attackSpeed) return;

        // Find the closest enemy
        let closestEnemy = null;
        let minDist = Infinity;
        for (let enemy of enemies) {
            let dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
            if (dist < minDist) {
                minDist = dist;
                closestEnemy = enemy;
            }
        }

        if (closestEnemy) {
            bullets.push(new Bullet(player.x, player.y, closestEnemy.x, closestEnemy.y));
            player.lastShot = currentTime;
        }
    }

    // Main Game Loop
    function gameLoop(currentTime) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameState === "PLAYING") {
            // 1. Player Movement (WASD or Arrow Keys)
            if (keys['w'] || keys['arrowup']) player.y = Math.max(player.radius, player.y - player.speed);
            if (keys['s'] || keys['arrowdown']) player.y = Math.min(canvas.height - player.radius, player.y + player.speed);
            if (keys['a'] || keys['arrowleft']) player.x = Math.max(player.radius, player.x - player.speed);
            if (keys['d'] || keys['arrowright']) player.x = Math.min(canvas.width - player.radius, player.x + player.speed);

            // Auto Attack
            autoAttack(currentTime);

            // 2. Update Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].update();
                bullets[i].draw();

                // Remove bullets that go off-screen
                if (bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Bullet - Enemy Collision
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (Math.hypot(bullets[i].x - enemies[j].x, bullets[i].y - enemies[j].y) < bullets[i].radius + enemies[j].radius) {
                        enemies[j].hp -= player.damage;
                        bullets.splice(i, 1);

                        if (enemies[j].hp <= 0) {
                            enemies.splice(j, 1);
                            player.materials += 1;
                            document.getElementById("goldTxt").innerText = player.materials;
                        }
                        break;
                    }
                }
            }

            // 3. Update Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].update();
                enemies[i].draw();

                // Enemy - Player Collision (Taking damage)
                if (Math.hypot(enemies[i].x - player.x, enemies[i].y - player.y) < enemies[i].radius + player.radius) {
                    player.hp -= 0.2; // Continuous contact damage
                    if (player.hp <= 0) {
                        gameState = "GAMEOVER";
                        clearInterval(timerInterval);
                        clearInterval(spawnInterval);
                    }
                }
            }

            // 4. Draw Player
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#44ff44";
            ctx.fill();
            ctx.closePath();

            // Player Health Bar (Right beneath the character)
            ctx.fillStyle = "red";
            ctx.fillRect(player.x - 20, player.y + 22, 40, 6);
            ctx.fillStyle = "green";
            ctx.fillRect(player.x - 20, player.y + 22, (Math.max(0, player.hp) / player.maxHp) * 40, 6);

        } else if (gameState === "GAMEOVER") {
            ctx.fillStyle = "rgba(0,0,0,0.8)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "red";
            ctx.font = "40px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
            ctx.fillStyle = "white";
            ctx.font = "20px sans-serif";
            ctx.fillText(`You made it to Wave ${wave}. Refresh the page to restart.`, canvas.width / 2, canvas.height / 2 + 40);
        }

        requestAnimationFrame(gameLoop);
    }

    // Start Game
    startIntervals();
    requestAnimationFrame(gameLoop);
</script>

</body>
</html>
