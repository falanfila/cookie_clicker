<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chefs vs Aliens</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#111;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:20px;font-family:system-ui,sans-serif;}
#gw{width:740px;background:linear-gradient(180deg,#1a0a2e 0%,#16213e 35%,#1a3a1a 65%,#2d5a27 100%);border-radius:12px;overflow:hidden;user-select:none;}
#ui{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(0,0,0,0.55);border-bottom:1px solid rgba(255,255,255,0.1);}
#suns{display:flex;align-items:center;gap:6px;background:rgba(255,200,0,0.18);border:1px solid rgba(255,200,0,0.4);border-radius:20px;padding:4px 12px;color:#ffd700;font-size:15px;font-weight:600;}
#winfo{color:rgba(255,255,255,0.65);font-size:13px;}
#lvlbadge{background:rgba(120,80,220,0.25);border:1px solid rgba(160,120,255,0.4);border-radius:20px;padding:3px 11px;color:#c8a8ff;font-size:13px;font-weight:600;}
#lives{margin-left:auto;display:flex;gap:3px;font-size:18px;}
#shop{display:flex;gap:7px;padding:7px 14px;background:rgba(0,0,0,0.4);border-bottom:1px solid rgba(255,255,255,0.07);}
.sc{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.15);border-radius:8px;padding:5px 9px;cursor:pointer;min-width:62px;transition:all .15s;}
.sc:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3);}
.sc.sel{border-color:#ffd700;background:rgba(255,215,0,0.15);}
.sc.poor{opacity:.35;cursor:not-allowed;}
.sc .si{font-size:21px;line-height:1.2;}
.sc .sn{font-size:9px;color:rgba(255,255,255,0.8);margin-top:1px;}
.sc .sp{font-size:10px;color:#ffd700;font-weight:600;}
#arena{position:relative;width:100%;height:390px;overflow:hidden;}
.row-strip{position:absolute;left:0;right:0;display:flex;align-items:stretch;}
.rocket-slot{width:30px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;cursor:default;transition:opacity .2s;}
.rocket-slot.used{opacity:0.2;}
.row-lbl{width:30px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.cell{flex:1;height:74px;border:1px solid rgba(255,255,255,0.07);border-radius:4px;cursor:pointer;position:relative;transition:background .12s;background:rgba(255,255,255,0.02);}
.cell:nth-child(odd){background:rgba(0,0,0,0.1);}
.cell:hover{background:rgba(255,255,255,0.12)!important;}
.dunit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;pointer-events:none;z-index:2;}
.dhp{position:absolute;bottom:4px;left:4px;right:4px;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;z-index:3;}
.dhp-fill{height:100%;background:#22dd66;border-radius:2px;transition:width .25s;}
.alien{position:absolute;font-size:27px;z-index:10;pointer-events:none;}
.alien-hp{position:absolute;height:3px;background:#ff3333;z-index:11;border-radius:2px;pointer-events:none;}
.proj{position:absolute;font-size:13px;z-index:9;pointer-events:none;}
.rocketfly{position:absolute;font-size:22px;z-index:25;pointer-events:none;}
.sdrop{position:absolute;font-size:23px;cursor:pointer;z-index:20;animation:fall 6s linear forwards;}
@keyframes fall{0%{opacity:0;transform:translateY(-15px)}10%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(35px)}}
.dpop{position:absolute;z-index:30;font-size:12px;font-weight:600;pointer-events:none;animation:pop .65s ease-out forwards;}
@keyframes pop{to{opacity:0;transform:translateY(-20px)}}
.boom{position:absolute;z-index:28;font-size:28px;pointer-events:none;animation:boom .5s ease-out forwards;}
@keyframes boom{0%{transform:scale(0.5);opacity:1}100%{transform:scale(2.5);opacity:0}}
#sbar{display:flex;gap:16px;padding:5px 14px;background:rgba(0,0,0,0.35);}
#sbar span{color:rgba(255,255,255,0.65);font-size:13px;}
.sv{color:#ffd700;font-weight:600;}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,5,25,0.94);border:1px solid rgba(255,255,255,0.22);border-radius:14px;padding:24px 34px;text-align:center;z-index:100;min-width:250px;display:none;}
#msg h2{color:#fff;font-size:20px;margin-bottom:8px;}
#msg p{color:rgba(255,255,255,0.65);font-size:13px;margin-bottom:14px;line-height:1.5;}
#msg button{background:#3aaa50;color:#fff;border:none;border-radius:8px;padding:9px 24px;font-size:14px;cursor:pointer;}
#msg button:hover{background:#2d9040;}
</style>
</head>
<body>
<div id="gw">
  <div id="ui">
    <div id="suns">☀️ <span id="sv">100</span></div>
    <div id="lvlbadge">Level <span id="lvv">1</span></div>
    <span id="winfo">Ready</span>
    <div id="lives"></div>
  </div>
  <div id="shop"></div>
  <div id="arena"></div>
  <div id="sbar">
    <span>Score: <span class="sv" id="scv">0</span></span>
    <span>Wave: <span class="sv" id="wv">0</span>/10</span>
    <span>Best: <span class="sv" id="bestv">—</span></span>
    <span style="color:rgba(255,255,255,0.3);font-size:11px;">Collect ☀️ → pick a chef → click a cell</span>
  </div>
  <div id="msg"><h2 id="mt"></h2><p id="mb"></p><button id="mbtn"></button></div>
</div>
<script>
const ROWS=5,COLS=9,CELL_H=74,ROCKET_W=30,LBL_W=30;
const CELL_OFFSET=ROCKET_W+LBL_W; // total left offset before cells
const ROW_LABELS=['🌿','🌾','🌿','🌾','🌿'];

const DEFS=[
  {id:'cook',name:'Chef',icon:'👨‍🍳',cost:50,hp:200,dmg:20,rate:1500},
  {id:'pepper',name:'Pepper',icon:'🌶️',cost:75,hp:120,dmg:45,rate:800},
  {id:'ice',name:'Ice Cream',icon:'🍦',cost:100,hp:150,dmg:18,rate:650},
  {id:'bomb',name:'Pumpkin',icon:'🎃',cost:100,hp:400,dmg:0,rate:0,isBomb:true},
  {id:'shield',name:'Pot',icon:'🍲',cost:50,hp:700,dmg:0,rate:0},
  {id:'laser',name:'Telescope',icon:'🔭',cost:150,hp:100,dmg:80,rate:1800,isLaser:true},
];

const BASE_ALIENS=[
  {icon:'👾',hp:80, spd:0.35,dmg:12,reward:10},
  {icon:'🛸',hp:160,spd:0.22,dmg:22,reward:20},
  {icon:'🤖',hp:320,spd:0.12,dmg:40,reward:40},
  {icon:'👽',hp:55, spd:0.55,dmg:8, reward:12},
];

const PROJ={cook:'🍳',pepper:'🌶️',ice:'❄️',laser:'⚡'};

// 10 waves per level, each wave pattern
const WAVE_PATTERNS=[
  [{r:0,t:0}],
  [{r:2,t:0},{r:4,t:0}],
  [{r:0,t:0},{r:2,t:3},{r:4,t:0}],
  [{r:1,t:1},{r:3,t:0},{r:0,t:3}],
  [{r:0,t:1},{r:2,t:0},{r:4,t:3},{r:1,t:0}],
  [{r:0,t:1},{r:1,t:3},{r:2,t:1},{r:3,t:0},{r:4,t:3}],
  [{r:0,t:2},{r:1,t:0},{r:2,t:1},{r:3,t:0},{r:4,t:2}],
  [{r:0,t:1},{r:1,t:1},{r:2,t:2},{r:3,t:1},{r:4,t:1}],
  [{r:0,t:2},{r:1,t:1},{r:2,t:3},{r:3,t:2},{r:4,t:1},{r:2,t:0}],
  [{r:0,t:2},{r:1,t:2},{r:2,t:2},{r:3,t:2},{r:4,t:2}],
];

function getAliens(level){
  const mult=1+0.25*(level-1);
  return BASE_ALIENS.map(a=>({
    ...a,
    hp:Math.round(a.hp*mult),
    spd:Math.min(a.spd*(1+0.1*(level-1)),1.2),
    dmg:Math.round(a.dmg*(1+0.15*(level-1)))
  }));
}

// State
let sun,score,lives,wave,level,sel,over,spawning,waitingNext;
let grid,aliens,projs,rockets,aid,pid;
let tickT,sunT,shootT,waveT;

function getCellW(){return(document.getElementById('arena').offsetWidth-CELL_OFFSET)/COLS;}
function rowTop(r){return r*CELL_H;}
function defX(c){return CELL_OFFSET+c*getCellW()+getCellW()/2;}

// localStorage
function saveProgress(){
  try{localStorage.setItem('cva_level',level);localStorage.setItem('cva_wave',wave);localStorage.setItem('cva_score',score);}catch(e){}
}
function loadBest(){
  try{
    const bl=parseInt(localStorage.getItem('cva_best_level'))||1;
    const bw=parseInt(localStorage.getItem('cva_best_wave'))||0;
    const bs=parseInt(localStorage.getItem('cva_best_score'))||0;
    return{level:bl,wave:bw,score:bs};
  }catch(e){return{level:1,wave:0,score:0};}
}
function saveBest(){
  try{
    const b=loadBest();
    const curTotal=(level-1)*10+wave;
    const bestTotal=(b.level-1)*10+b.wave;
    if(curTotal>bestTotal){
      localStorage.setItem('cva_best_level',level);
      localStorage.setItem('cva_best_wave',wave);
      localStorage.setItem('cva_best_score',score);
    }
  }catch(e){}
}
function updateBestDisplay(){
  const b=loadBest();
  document.getElementById('bestv').textContent=b.level>1||b.wave>0?`L${b.level}W${b.wave}`:'—';
}

function buildGrid(){
  const arena=document.getElementById('arena');
  arena.innerHTML='';grid=[];rockets=[];
  for(let r=0;r<ROWS;r++){
    grid[r]=new Array(COLS).fill(null);
    rockets[r]=true; // has rocket
    const strip=document.createElement('div');
    strip.className='row-strip';
    strip.style.cssText=`top:${rowTop(r)}px;height:${CELL_H}px;`;

    // Rocket slot
    const rs=document.createElement('div');
    rs.className='rocket-slot';rs.id='rs'+r;rs.textContent='🚀';
    rs.title='Rocket — triggers when aliens reach this lane!';
    strip.appendChild(rs);

    const lbl=document.createElement('div');lbl.className='row-lbl';lbl.textContent=ROW_LABELS[r];
    strip.appendChild(lbl);

    for(let c=0;c<COLS;c++){
      const cell=document.createElement('div');cell.className='cell';
      cell.setAttribute('data-r',r);cell.setAttribute('data-c',c);
      cell.addEventListener('click',handleCellClick);
      strip.appendChild(cell);
    }
    arena.appendChild(strip);
  }
}

function handleCellClick(e){
  if(!sel||over)return;
  const r=parseInt(e.currentTarget.getAttribute('data-r'));
  const c=parseInt(e.currentTarget.getAttribute('data-c'));
  if(grid[r][c])return;
  const def=DEFS.find(d=>d.id===sel);
  if(!def||sun<def.cost)return;
  sun-=def.cost;
  grid[r][c]={...def,curHp:def.hp,_lastShot:0};
  renderCell(r,c,e.currentTarget);
  updateSun();updateShop();
}

function renderCell(r,c,cellEl){
  const cell=cellEl||findCell(r,c);if(!cell)return;
  cell.innerHTML='';
  const d=grid[r][c];if(!d)return;
  const u=document.createElement('div');u.className='dunit';u.textContent=d.icon;
  const hw=document.createElement('div');hw.className='dhp';
  const hf=document.createElement('div');hf.className='dhp-fill';hf.style.width='100%';
  hw.appendChild(hf);cell.appendChild(u);cell.appendChild(hw);cell._hf=hf;
}

function findCell(r,c){
  const strips=document.querySelectorAll('.row-strip');
  if(strips[r]){const cells=strips[r].querySelectorAll('.cell');return cells[c]||null;}
  return null;
}

function buildShop(){
  const shop=document.getElementById('shop');shop.innerHTML='';
  DEFS.forEach(d=>{
    const el=document.createElement('div');el.className='sc';el.id='sc_'+d.id;
    el.innerHTML=`<span class="si">${d.icon}</span><span class="sn">${d.name}</span><span class="sp">☀️${d.cost}</span>`;
    el.onclick=()=>{
      if(over||sun<d.cost)return;
      sel=sel===d.id?null:d.id;
      document.querySelectorAll('.sc').forEach(e=>e.classList.remove('sel'));
      if(sel)document.getElementById('sc_'+d.id).classList.add('sel');
    };
    shop.appendChild(el);
  });
}

function updateSun(){document.getElementById('sv').textContent=sun;}
function updateShop(){DEFS.forEach(d=>{const e=document.getElementById('sc_'+d.id);if(e)e.classList.toggle('poor',sun<d.cost);});}
function updateLives(){document.getElementById('lives').innerHTML=Array(lives).fill('❤️').join('')+Array(5-lives).fill('<span style="opacity:.18">❤️</span>').join('');}
function updateHUD(){
  document.getElementById('wv').textContent=wave;
  document.getElementById('lvv').textContent=level;
  document.getElementById('scv').textContent=score;
}

function spawnAlien(row,atype){
  const arena=document.getElementById('arena');
  const el=document.createElement('div');el.className='alien';el.id='al'+aid;
  el.textContent=atype.icon;
  const sx=arena.offsetWidth+10;
  el.style.cssText=`top:${rowTop(row)+(CELL_H-30)/2}px;left:${sx}px;`;
  const hp=document.createElement('div');hp.className='alien-hp';hp.id='ahp'+aid;
  hp.style.cssText=`top:${rowTop(row)+CELL_H-10}px;left:${sx}px;width:30px;`;
  arena.appendChild(el);arena.appendChild(hp);
  aliens.push({id:aid++,row,type:atype,x:sx,hp:atype.hp,maxHp:atype.hp,eating:false,eatInt:null});
}

function removeAlien(id,killed){
  const idx=aliens.findIndex(a=>a.id===id);if(idx<0)return;
  const a=aliens[idx];
  if(a.eatInt){clearInterval(a.eatInt);a.eatInt=null;}
  document.getElementById('al'+id)?.remove();
  document.getElementById('ahp'+id)?.remove();
  aliens.splice(idx,1);
  if(killed){score+=a.type.reward;updateHUD();}
}

function launchRocket(row){
  if(!rockets[row])return;
  rockets[row]=false;
  const rs=document.getElementById('rs'+row);
  if(rs)rs.classList.add('used');

  const arena=document.getElementById('arena');
  const rkt=document.createElement('div');rkt.className='rocketfly';
  rkt.textContent='🚀';
  rkt.style.cssText=`top:${rowTop(row)+(CELL_H-28)/2}px;left:${ROCKET_W/2}px;transform:rotate(90deg);`;
  arena.appendChild(rkt);

  // Kill all aliens in this row with animation
  const rowAliens=aliens.filter(a=>a.row===row).map(a=>a.id);

  let x=ROCKET_W;
  const arW=arena.offsetWidth;
  const flyInt=setInterval(()=>{
    x+=18;rkt.style.left=x+'px';
    // sweep kill aliens as rocket passes
    aliens.filter(a=>a.row===row&&a.x<=x+30).forEach(a=>{
      showBoom(a.x,rowTop(row)+CELL_H/2);
      removeAlien(a.id,true);
    });
    if(x>arW+40){clearInterval(flyInt);rkt.remove();}
  },30);

  // Also nuke any defenders in this row
  for(let c=0;c<COLS;c++){
    if(grid[row][c]){grid[row][c]=null;renderCell(row,c);}
  }
}

function showBoom(x,y){
  const arena=document.getElementById('arena');
  const el=document.createElement('div');el.className='boom';
  el.textContent='💥';el.style.cssText=`left:${x}px;top:${y-20}px;`;
  arena.appendChild(el);setTimeout(()=>el.remove(),500);
}

function tick(){
  if(over)return;
  const cw=getCellW();
  const arena=document.getElementById('arena');
  const arW=arena.offsetWidth;

  aliens.forEach(a=>{
    if(a.eating)return;
    a.x-=a.type.spd*2.6;
    const el=document.getElementById('al'+a.id);if(el)el.style.left=a.x+'px';
    const hpEl=document.getElementById('ahp'+a.id);
    if(hpEl){hpEl.style.left=a.x+'px';hpEl.style.width=Math.max(0,(a.hp/a.maxHp)*30)+'px';}

    // Reached rocket zone?
    if(a.x<=CELL_OFFSET+5&&rockets[a.row]){
      launchRocket(a.row);return;
    }
    // Past everything — lose a life
    if(a.x<ROCKET_W-10){
      lives=Math.max(0,lives-1);updateLives();removeAlien(a.id,false);
      saveBest();
      if(lives<=0)triggerEnd();return;
    }
    const col=Math.floor((a.x-CELL_OFFSET)/cw);
    if(col>=0&&col<COLS&&grid[a.row][col]&&!a.eating){startEating(a,a.row,col);}
  });

  // Projectiles
  const rem=[];
  projs.forEach(p=>{
    p.x+=14;
    const el=document.getElementById('pj'+p.id);if(el)el.style.left=p.x+'px';
    const tgt=aliens.find(a=>a.id===p.tid);
    if(!tgt){rem.push(p.id);if(el)el.remove();return;}
    if(p.x>=tgt.x){damageAlien(tgt,p.dmg);rem.push(p.id);if(el)el.remove();}
    if(p.x>arW+60){rem.push(p.id);if(el)el.remove();}
  });
  projs=projs.filter(p=>!rem.includes(p.id));

  // Wave complete
  if(!spawning&&!waitingNext&&aliens.length===0){
    waitingNext=true;
    saveProgress();saveBest();updateBestDisplay();
    if(wave>=10){
      // Level complete
      document.getElementById('winfo').textContent=`Level ${level} complete! 🎉`;
      waveT=setTimeout(()=>{
        level++;wave=0;waitingNext=false;
        updateHUD();
        // Reset rockets
        rockets=Array(ROWS).fill(true);
        for(let r=0;r<ROWS;r++){const rs=document.getElementById('rs'+r);if(rs)rs.classList.remove('used');}
        showMsg(`Level ${level}! 🚀`,`Difficulty increased! HP +25%, Speed +10%, Damage +15%\nRockets refilled. Good luck!`,'Continue',()=>{hideMsg();setTimeout(spawnWave,1500);});
      },2000);
    } else {
      document.getElementById('winfo').textContent='Get ready...';
      waveT=setTimeout(()=>{waitingNext=false;spawnWave();},3500);
    }
  }
}

function startEating(alien,r,c){
  alien.eating=true;
  alien.eatInt=setInterval(()=>{
    if(over){clearInterval(alien.eatInt);return;}
    const d=grid[r]?.[c];
    if(!d){clearInterval(alien.eatInt);alien.eatInt=null;alien.eating=false;return;}
    d.curHp-=alien.type.dmg;
    showPop(r,c,'-'+alien.type.dmg,'#ff7777');
    const cell=findCell(r,c);if(cell&&cell._hf)cell._hf.style.width=Math.max(0,(d.curHp/d.hp)*100)+'%';
    if(d.isBomb){bombExplode(r,c);}
    else if(d.curHp<=0){grid[r][c]=null;renderCell(r,c);clearInterval(alien.eatInt);alien.eatInt=null;alien.eating=false;}
  },900);
}

function bombExplode(r,c){
  grid[r][c]=null;renderCell(r,c);
  showPop(r,c,'💥','#ffaa00');
  const cw=getCellW();
  const toKill=[];
  aliens.forEach(a=>{
    if(Math.abs(a.row-r)<=1){
      const ac=Math.floor((a.x-CELL_OFFSET)/cw);
      if(Math.abs(ac-c)<=2)toKill.push(a.id);
    }
  });
  toKill.forEach(id=>{
    const a=aliens.find(x=>x.id===id);
    if(a){if(a.eatInt)clearInterval(a.eatInt);a.eatInt=null;a.eating=false;}
    removeAlien(id,true);
  });
}

function damageAlien(alien,dmg){
  alien.hp-=dmg;showAlienPop(alien,dmg);
  if(alien.hp<=0)removeAlien(alien.id,true);
}

function showPop(r,c,txt,color){
  const arena=document.getElementById('arena');
  const el=document.createElement('div');el.className='dpop';
  const cx=CELL_OFFSET+c*getCellW()+getCellW()/2;
  el.style.cssText=`left:${cx-10}px;top:${rowTop(r)+15}px;color:${color};`;
  el.textContent=txt;arena.appendChild(el);setTimeout(()=>el.remove(),650);
}

function showAlienPop(alien,dmg){
  const arena=document.getElementById('arena');
  const el=document.createElement('div');el.className='dpop';
  el.style.cssText=`left:${alien.x+4}px;top:${rowTop(alien.row)+12}px;color:#88ff88;`;
  el.textContent='-'+dmg;arena.appendChild(el);setTimeout(()=>el.remove(),650);
}

function doShoot(){
  if(over)return;
  const arena=document.getElementById('arena');
  const cw=getCellW();
  const now=Date.now();
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const d=grid[r][c];
      if(!d||d.rate===0)continue;
      if(now-d._lastShot<d.rate)continue;
      const dx=defX(c);
      const rowAliens=aliens.filter(a=>a.row===r&&a.x>dx);
      if(!rowAliens.length)continue;
      d._lastShot=now;
      if(d.isLaser){
        rowAliens.forEach(a=>damageAlien(a,d.dmg));
        const rightmost=rowAliens.reduce((b,a)=>a.x>b.x?a:b,rowAliens[0]);
        const fl=document.createElement('div');
        fl.style.cssText=`position:absolute;top:${rowTop(r)+CELL_H/2-2}px;left:${dx}px;width:${rightmost.x-dx+20}px;height:4px;background:rgba(120,160,255,0.8);border-radius:2px;z-index:8;pointer-events:none;`;
        arena.appendChild(fl);setTimeout(()=>fl.remove(),150);
        continue;
      }
      const tgt=rowAliens.reduce((b,a)=>a.x<b.x?a:b,rowAliens[0]);
      const el=document.createElement('div');el.className='proj';el.id='pj'+pid;
      el.textContent=PROJ[d.id]||'•';
      el.style.cssText=`left:${dx}px;top:${rowTop(r)+CELL_H/2-9}px;`;
      arena.appendChild(el);
      projs.push({id:pid++,x:dx,row:r,tid:tgt.id,dmg:d.dmg});
    }
  }
}

function dropSun(){
  if(over)return;
  const arena=document.getElementById('arena');
  const x=70+Math.random()*(arena.offsetWidth-140);
  const y=15+Math.random()*210;
  const el=document.createElement('div');el.className='sdrop';
  el.textContent='☀️';el.style.cssText=`left:${x}px;top:${y}px;`;
  el.onclick=()=>{sun=Math.min(999,sun+25);updateSun();updateShop();el.remove();};
  arena.appendChild(el);setTimeout(()=>{if(el.parentNode)el.remove();},6000);
}

function spawnWave(){
  if(over)return;
  wave++;updateHUD();
  document.getElementById('winfo').textContent=`Wave ${wave}/10`;
  spawning=true;
  const ALIENS=getAliens(level);
  const pi=((wave-1)%WAVE_PATTERNS.length);
  let enemies=[...WAVE_PATTERNS[pi]];
  // Extra enemies per level
  const extras=Math.floor((level-1)*1.5);
  for(let i=0;i<extras;i++){
    enemies.push({r:Math.floor(Math.random()*5),t:Math.min(3,Math.floor(Math.random()*(1+Math.floor(level/2))))});
  }
  let i=0;
  function next(){
    if(i>=enemies.length||over){spawning=false;return;}
    const e=enemies[i++];spawnAlien(e.r,ALIENS[e.t]);
    setTimeout(next,Math.max(300,700-level*30)+Math.random()*400);
  }
  next();
}

function triggerEnd(){
  over=true;
  clearInterval(tickT);clearInterval(sunT);clearInterval(shootT);clearTimeout(waveT);
  saveBest();updateBestDisplay();
  showMsg('Game Over! 💀',`Score: ${score} | Reached Level ${level}, Wave ${wave}\nYour best: L${loadBest().level} W${loadBest().wave}`,'Play Again',resetGame);
}

function showMsg(t,b,btn,cb){
  document.getElementById('mt').textContent=t;
  document.getElementById('mb').innerHTML=b.replace(/\n/g,'<br>');
  document.getElementById('mbtn').textContent=btn;
  document.getElementById('mbtn').onclick=cb||null;
  document.getElementById('msg').style.display='block';
}
function hideMsg(){document.getElementById('msg').style.display='none';}

function initState(){
  sun=100;score=0;lives=5;wave=0;level=1;sel=null;over=false;spawning=false;waitingNext=false;
  aliens=[];projs=[];rockets=[];aid=0;pid=0;
}

function resetGame(){
  clearInterval(tickT);clearInterval(sunT);clearInterval(shootT);clearTimeout(waveT);
  aliens.forEach(a=>{if(a.eatInt)clearInterval(a.eatInt);});
  document.querySelectorAll('.alien,.alien-hp,.proj,.sdrop,.dpop,.boom,.rocketfly').forEach(e=>e.remove());
  initState();
  buildGrid();updateSun();updateShop();updateLives();updateHUD();updateBestDisplay();
  hideMsg();startGame();
}

function startGame(){
  hideMsg();over=false;updateLives();updateHUD();
  tickT=setInterval(tick,50);
  shootT=setInterval(doShoot,80);
  sunT=setInterval(dropSun,5000);
  setTimeout(spawnWave,2500);
}

// Boot
initState();buildShop();buildGrid();updateSun();updateLives();updateHUD();updateBestDisplay();
showMsg('Chefs vs Aliens 👽🍳',
  'Aliens are invading the kitchen!\nPlace chefs to stop them. Collect ☀️ for coins.\n🚀 Rockets wipe the whole lane — use them wisely!',
  "Let's Go!",startGame);
</script>
</body>
