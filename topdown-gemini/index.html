<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="gemini.png">
    <title>Top-down Shooter - Web Edition</title>
    <h1>Gemini 3.5 Flash version</h1>
    <style>
        /* Tüm ekranı kaplayan, modern ve taşmaları engelleyen responsive tasarım */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            background-color: #242424;
            display: block;
        }
        /* Geliştirilmiş UI Tasarımı */
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #ui span {
            color: #00ffcc;
        }
        /* Brotato Tarzı Pop-up Geliştirme Menüsü */
        #upgradeMenu {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 15, 0.95);
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #00ffcc;
            text-align: center;
            min-width: 320px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }
        #upgradeMenu h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #00ffcc;
        }
        .upgradeBtn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .upgradeBtn:hover {
            background: #00ffcc;
            color: #121212;
            border-color: #00ffcc;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <!-- Standart 16:9 tarayıcı oyun çözünürlüğü -->
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    
    <div id="ui">
        Wave: <span id="waveTxt">1</span> | 
        Time: <span id="timeTxt">20</span>s | 
        Materials: <span id="goldTxt">0</span>
    </div>

    <div id="upgradeMenu">
        <h2>WAVE CLEARED!</h2>
        <p style="margin-bottom: 15px; color: #aaa;">Select an item to upgrade:</p>
        <button class="upgradeBtn" onclick="chooseUpgrade('damage')">💥 +2 Damage</button>
        <button class="upgradeBtn" onclick="chooseUpgrade('speed')">👟 +0.5 Move Speed</button>
        <button class="upgradeBtn" onclick="chooseUpgrade('hp')">❤️ +20 Max HP</button>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let gameState = "PLAYING"; 
let wave = 1;
let waveTimer = 20; 
let timerInterval;
let spawnInterval;

const keys = {};
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

const player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 14,
    speed: 3.8,
    hp: 100,
    maxHp: 100,
    damage: 6,
    attackSpeed: 350, 
    lastShot: 0,
    materials: 0
};

let enemies = [];
let bullets = [];

class Enemy {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 12;
        this.speed = 1.4 + (wave * 0.12);
        this.hp = 10 + (wave * 4);
        this.maxHp = this.hp;
    }
    update() {
        let dx = player.x - this.x;
        let dy = player.y - this.y;
        let dist = Math.hypot(dx, dy);
        if (dist > 0) {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#ff4d4d";
        ctx.fill();
        ctx.closePath();
        
        // Enemy Health Bar
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(this.x - 15, this.y - 20, 30, 4);
        ctx.fillStyle = "#ff4d4d";
        ctx.fillRect(this.x - 15, this.y - 20, (this.hp / this.maxHp) * 30, 4);
    }
}

class Bullet {
    constructor(x, y, targetX, targetY) {
        this.x = x;
        this.y = y;
        this.radius = 4;
        this.speed = 8;
        let dx = targetX - x;
        let dy = targetY - y;
        let dist = Math.hypot(dx, dy);
        this.vx = (dx / dist) * this.speed;
        this.vy = (dy / dist) * this.speed;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#fffb00";
        ctx.fill();
        ctx.closePath();
    }
}

function spawnEnemy() {
    if (gameState !== "PLAYING") return;
    let x, y;
    if (Math.random() < 0.5) {
        x = Math.random() < 0.5 ? -20 : canvas.width + 20;
        y = Math.random() * canvas.height;
    } else {
        x = Math.random() * canvas.width;
        y = Math.random() < 0.5 ? -20 : canvas.height + 20;
    }
    enemies.push(new Enemy(x, y));
}

function startIntervals() {
    timerInterval = setInterval(() => {
        if (gameState === "PLAYING") {
            waveTimer--;
            document.getElementById("timeTxt").innerText = waveTimer;
            if (waveTimer <= 0) endWave();
        }
    }, 1000);

    let baseSpawnRate = 900 - (wave * 60);
    if (baseSpawnRate < 300) baseSpawnRate = 300; // Limit dynamic difficulty max spawn rate
    spawnInterval = setInterval(spawnEnemy, baseSpawnRate);
}

function endWave() {
    gameState = "UPGRADE";
    clearInterval(timerInterval);
    clearInterval(spawnInterval);
    enemies = [];
    bullets = [];
    document.getElementById("upgradeMenu").style.display = "block";
}

function chooseUpgrade(type) {
    if (type === 'damage') player.damage += 2;
    if (type === 'speed') player.speed += 0.4;
    if (type === 'hp') {
        player.maxHp += 20;
        player.hp += 20;
    }
    
    wave++;
    waveTimer = 20;
    document.getElementById("waveTxt").innerText = wave;
    document.getElementById("timeTxt").innerText = waveTimer;
    document.getElementById("upgradeMenu").style.display = "none";
    gameState = "PLAYING";
    startIntervals();
}

function autoAttack(currentTime) {
    if (enemies.length === 0) return;
    if (currentTime - player.lastShot < player.attackSpeed) return;

    let closestEnemy = null;
    let minDist = Infinity;
    for (let enemy of enemies) {
        let dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
        if (dist < minDist) {
            minDist = dist;
            closestEnemy = enemy;
        }
    }

    if (closestEnemy) {
        bullets.push(new Bullet(player.x, player.y, closestEnemy.x, closestEnemy.y));
        player.lastShot = currentTime;
    }
}

function gameLoop(currentTime) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === "PLAYING") {
        if (keys['w'] || keys['arrowup']) player.y = Math.max(player.radius, player.y - player.speed);
        if (keys['s'] || keys['arrowdown']) player.y = Math.min(canvas.height - player.radius, player.y + player.speed);
        if (keys['a'] || keys['arrowleft']) player.x = Math.max(player.radius, player.x - player.speed);
        if (keys['d'] || keys['arrowright']) player.x = Math.min(canvas.width - player.radius, player.x + player.speed);

        autoAttack(currentTime);

        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].update();
            bullets[i].draw();

            if (bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) {
                bullets.splice(i, 1);
                continue;
            }

            for (let j = enemies.length - 1; j >= 0; j--) {
                if (Math.hypot(bullets[i].x - enemies[j].x, bullets[i].y - enemies[j].y) < bullets[i].radius + enemies[j].radius) {
                    enemies[j].hp -= player.damage;
                    bullets.splice(i, 1);

                    if (enemies[j].hp <= 0) {
                        enemies.splice(j, 1);
                        player.materials += 1;
                        document.getElementById("goldTxt").innerText = player.materials;
                    }
                    break;
                }
            }
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            enemies[i].update();
            enemies[i].draw();

            if (Math.hypot(enemies[i].x - player.x, enemies[i].y - player.y) < enemies[i].radius + player.radius) {
                player.hp -= 0.25; 
                if (player.hp <= 0) {
                    gameState = "GAMEOVER";
                    clearInterval(timerInterval);
                    clearInterval(spawnInterval);
                }
            }
        }

        // Draw Player
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#00ffcc";
        ctx.fill();
        ctx.closePath();

        // Player Health Bar
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(player.x - 20, player.y + 22, 40, 6);
        ctx.fillStyle = "#00ffcc";
        ctx.fillRect(player.x - 20, player.y + 22, (Math.max(0, player.hp) / player.maxHp) * 40, 6);

    } else if (gameState === "GAMEOVER") {
        if (wave === 1){
            alert("Congratulations! You've found this easter egg by proving that you're a real noob - you've died in the first wave!")
            break
        }
        ctx.fillStyle = "rgba(10, 10, 10, 0.9)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff4d4d";
        ctx.font = "bold 40px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = "#ffffff";
        ctx.font = "18px sans-serif";
        ctx.fillText(`You survived until Wave ${wave}`, canvas.width / 2, canvas.height / 2 + 20);
        ctx.fillStyle = "#aaa";
        ctx.font = "14px sans-serif";
        ctx.fillText("Refresh the page to try again", canvas.width / 2, canvas.height / 2 + 50);
    }

    requestAnimationFrame(gameLoop);
}

startIntervals();
requestAnimationFrame(gameLoop);
</script>

</body>
</html>
